name: Create Packager Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., 2026.10.16)'
        required: true

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          gh release create "$VERSION" --title "Release $VERSION" --generate-notes
